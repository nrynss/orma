# T3.1 owns [functions.telegram]. Telegram posts webhooks with no JWT.
# T5.1 owns the [auth] block only. It must not change verify_jwt here.

[functions.telegram]
verify_jwt = false

# T2.1 owns this block. pg_cron authenticates with the named materialise secret
# API key, which @supabase/server validates in the handler.
[functions.materialise]
verify_jwt = false

# T2.4 owns this block. The minute cron uses the same named Vault scheduler
# key as Materialise, which @supabase/server validates in the handler.
[functions.tick]
verify_jwt = false

# T2.6 owns this block. CALL-E sends no Supabase JWT, so the handler gates
# every request with ORMA_WEBHOOK_SECRET embedded in its webhook path.
[functions.calle-webhook]
verify_jwt = false

# T4.2a owns this block. The handler answers a missing or expired token with a
# clean 401 protocol error, so the gateway JWT check stays off.
[functions.mcp]
verify_jwt = false

# T7.3 owns this block. The weekly analysis cron uses the named materialise
# secret API key, which @supabase/server validates in the handler.
[functions.analysis]
verify_jwt = false
